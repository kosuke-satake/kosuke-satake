<svg xmlns="http://www.w3.org/2000/svg" width="888" height="256" viewBox="0 0 888 256" role="img" aria-label="esp32-ros2-rover architecture: a ROS 2 brain sends velocity to an ESP32 body and receives odometry; the body drives two motors; an iPhone can send velocity to the body; a physical e-stop cuts motor power">
  <defs>
    <marker id="head-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .box { font-size: 15px; font-weight: 600; fill: #1f2328; }
    .note { font-size: 12.5px; fill: #656d76; }
    .label { font-size: 12.5px; font-weight: 500; }
  </style>
  <rect x="344" y="4" width="200" height="56" rx="12" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/><text x="444.0" y="32" text-anchor="middle" class="box">Controller</text><text x="444.0" y="52" text-anchor="middle" class="note">iPhone, tilt to drive</text><rect x="40" y="96" width="200" height="84" rx="12" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/><text x="140.0" y="124" text-anchor="middle" class="box">Brain</text><text x="140.0" y="144" text-anchor="middle" class="note">ROS 2</text><text x="140.0" y="161" text-anchor="middle" class="note">Mac (Docker) now, phone next</text><rect x="344" y="96" width="200" height="84" rx="12" fill="#f6f8fa" stroke="#0969da" stroke-width="2"/><text x="444.0" y="124" text-anchor="middle" class="box">Body</text><text x="444.0" y="144" text-anchor="middle" class="note">ESP32: kinematics + PID,</text><text x="444.0" y="161" text-anchor="middle" class="note">encoders, safety stop</text><rect x="648" y="96" width="200" height="84" rx="12" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/><text x="748.0" y="124" text-anchor="middle" class="box">Motors</text><text x="748.0" y="144" text-anchor="middle" class="note">2 geared motors</text><text x="748.0" y="161" text-anchor="middle" class="note">with encoders</text><rect x="648" y="208" width="200" height="40" rx="12" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/><text x="748.0" y="236" text-anchor="middle" class="box">Physical e-stop</text><line x1="246" y1="124" x2="336" y2="124" stroke="#0969da" stroke-width="2" marker-end="url(#head-accent)"/><text x="291.0" y="116.0" text-anchor="middle" class="label" fill="#0969da">velocity</text><line x1="338" y1="156" x2="248" y2="156" stroke="#0969da" stroke-width="2" marker-end="url(#head-accent)"/><text x="293.0" y="176.0" text-anchor="middle" class="label" fill="#0969da">odometry</text><line x1="550" y1="124" x2="640" y2="124" stroke="#0969da" stroke-width="2" marker-end="url(#head-accent)"/><text x="595.0" y="116.0" text-anchor="middle" class="label" fill="#0969da">PWM</text><line x1="642" y1="156" x2="552" y2="156" stroke="#0969da" stroke-width="2" marker-end="url(#head-accent)"/><text x="597.0" y="176.0" text-anchor="middle" class="label" fill="#0969da">encoders</text><line x1="444.0" y1="62" x2="444.0" y2="92" stroke="#0969da" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#head-accent)"/><text x="454.0" y="81.0" text-anchor="start" class="label" fill="#0969da">velocity</text><line x1="748.0" y1="206" x2="748.0" y2="184" stroke="#cf222e" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#head-danger)"/><text x="758.0" y="199.0" text-anchor="start" class="label" fill="#cf222e">cuts motor power</text>
</svg>
